plugins {
    id("com.android.application")
}

android {
    // NexHookPro v7.0.2 — com.nexhook.pro — API 25 → 35
    namespace = "com.nexhook.pro"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.nexhook.pro"
        minSdk = 25
        targetSdk = 35
        versionCode = 702
        versionName = "7.0.2"
    }

    // Release signing is done explicitly in build.sh (zipalign + apksigner
    // with v1+v2) so the exact schemes are guaranteed regardless of AGP
    // defaults. Keystore: keystore/loktvhookpro.jks (git-ignored, generated
    // by build.sh when missing). Pass -PLOKTV_KEY_PASS=... to override.

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    // Legacy Xposed API (HookEntry via assets/xposed_init) — runtime provided by
    // LSPosed / EdXposed (root) or LSPatch / NPatch / HKPatcher (rootless).
    compileOnly(files("libs/xposed-api-82.jar"))
    // Modern libxposed API 102 (MainHook via META-INF/xposed/java_init.list).
    compileOnly(files("libs/libxposed-api-102.jar"))
}
